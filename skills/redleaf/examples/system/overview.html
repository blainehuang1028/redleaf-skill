<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>红笺 · 排版与色彩</title><style>@font-face{font-family:RedleafSans;src:url(../../assets/fonts/sans.otf)}*{box-sizing:border-box}body{margin:0;padding:32px 42px;background:#e5e1d6;color:#2b2c27;font:20px/1.6 RedleafSans,sans-serif}h1{font-size:30px;font-weight:400;margin:0 0 10px}p{font-size:17px;color:#716a5d;margin:0}.swatches{display:flex;gap:30px;margin:23px 0 30px}.swatches span{display:flex;align-items:center;gap:10px;font-size:17px}.swatches i{width:17px;height:17px;border-radius:50%;background:var(--c)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}.frame{height:720px;position:relative;overflow:hidden}iframe{width:1080px;height:1440px;border:0;position:absolute;top:0;left:0;transform-origin:top left}.label{font-size:17px;margin:0 0 10px}.foot{margin-top:24px;font-size:15px}</style><h1>红笺 / 纸墨排版系统</h1><p>贴字的粗笔触 · 统一的字体层级 · 五种传统色方向</p><div class="swatches"><span><i style="--c:#b84b48"></i>朱砂</span><span><i style="--c:#134857"></i>苍蓝</span><span><i style="--c:#223e36"></i>苍绿</span><span><i style="--c:#862617"></i>赭石</span><span><i style="--c:#ffd111"></i>藤黄</span></div><div class="grid"><div><p class="label">封面 · 笔触更粗、更贴近字脚</p><div class="frame"><iframe src="cover.html"></iframe></div></div><div><p class="label">正文 · 宋体标题与黑体阅读</p><div class="frame"><iframe src="reading.html"></iframe></div></div></div><p class="foot">演示文字，非用户原文。完整系统另含引用、步骤、表格、跨页提示词与配图版式。</p><script>function resize(){document.querySelectorAll('iframe').forEach(f=>{const scale=f.parentElement.clientWidth/1080;f.style.transform=`scale(${scale})`;f.parentElement.style.height=(1440*scale)+'px';});}new ResizeObserver(resize).observe(document.querySelector('.grid'));window.ready=Promise.all([...document.querySelectorAll('iframe')].map(f=>new Promise(resolve=>f.addEventListener('load',async()=>{await f.contentWindow.ready;resize();resolve();}))));</script></html>
