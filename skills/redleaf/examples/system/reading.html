<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红笺 · 连续阅读</title><link rel="stylesheet" href="../../assets/redleaf.css"><article class="page reading" data-theme="zhusha"><canvas class="paper" aria-hidden="true"></canvas><div class="content"><h1>教培行业的老师，<br>不要被 AI 抛弃</h1><p>备课、整理资料、批改作业，都是可以开始尝试的地方。不必一下子改变整套工作方式，先挑一件每天都要做、又很耗时间的小事。</p><p>比如整理一份雅思写作练习：把题目、学生的原稿和你的批注放在一起，再让 AI 协助归类。<mark>先解决手边的问题</mark>，也更容易坚持下去。</p><p>工具给出的建议，仍然需要老师判断。哪些表达适合这个学生，哪一步需要多讲一次，不能只看生成的文字是否流畅。</p></div><footer><span>排版演示 · 非用户原文</span><span>02 / 08</span></footer></article><script src="../../assets/material.js"></script></html>
